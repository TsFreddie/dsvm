<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeepSeek Harness (dsvm)</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    body { font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans SC", sans-serif; }
    #view { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    #overlay {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: var(--dsh-boot-bg, #fff);
    }
    @media (prefers-color-scheme: dark) { #overlay { background: #151517; } }
    .card { max-width: 560px; padding: 32px; text-align: center; }
    .spinner {
      width: 36px; height: 36px; margin: 0 auto 16px; border-radius: 50%;
      border: 3px solid rgba(127, 127, 127, .35); border-top-color: currentColor;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
    p { font-size: 14px; line-height: 1.7; opacity: .8; margin: 8px 0; }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
      background: rgba(127, 127, 127, .15); padding: 1px 6px; border-radius: 4px;
    }
    pre {
      text-align: left; font-size: 12.5px; line-height: 1.7; white-space: pre-wrap;
      background: rgba(127, 127, 127, .12); padding: 12px 14px; border-radius: 8px;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <!--
    dsh 以 <webview> 嵌入展示，而不是顶层跳转或 iframe：
    顶层跳转会卸载本页，导致拿不到跳转状态、重试逻辑一并丢失；
    webview 跑在独立进程，默认不带 Node，与应用互相隔离，
    还提供 loadabort（真实失败原因）与 newwindow（可转外部浏览器）事件。
  -->
  <webview id="view" partition="persist:dsvm-desktop" hidden></webview>

  <div id="overlay">
    <div class="card" id="connecting">
      <div class="spinner"></div>
      <h1>正在连接 dsh……</h1>
      <p id="connecting-hint">正在读取本地服务地址，请稍候。</p>
    </div>
    <div class="card" id="failure" hidden>
      <h1>dsh 当前没有启用</h1>
      <p>没有读到正在运行的 dsvm 服务地址。请先用 dsvm 把 service 配置并启动起来：</p>
      <pre>dsvm service install   # 注册后台服务定义（默认端口 7766）
dsvm service enable    # 立即启动并设置登录自启
dsvm service url       # 启动成功后输出带 token 的访问地址</pre>
      <p id="retry-hint">会自动重试。</p>
    </div>
  </div>

  <script>
    'use strict';
    const fs = require('fs');
    const os = require('os');
    const path = require('path');
    const openExternalUrl = require('./open-external.js');

    const RETRY_MS = 3000;          // 可见时连接失败的重试间隔
    const LOAD_TIMEOUT_MS = 10000;  // webview 置 src 后等待装载的超时（loadabort 会更快给出失败）
    const HIDE_UNLOAD_MS = 5_000;   // 轻量后台模式：持续不可见多久后卸载 dsh 释放资源

    const view = document.getElementById('view');
    const overlay = document.getElementById('overlay');
    const connecting = document.getElementById('connecting');
    const failure = document.getElementById('failure');
    const connectingHint = document.getElementById('connecting-hint');

    let state = 'connecting'; // 'connecting' | 'ready' | 'error'
    let firstRun = true;      // 只有首次启动显示全屏 spinner，之后一律静默重试防闪屏
    let currentUrl = null;    // 已成功装载的 dsh URL（token 每次启动都会变）
    let navUrl = null;        // 上次实际交给 webview 的 URL（同值重复赋值会产生幻影 abort）
    let needsReload = false;  // 同 URL 也需要重载（ genuine 失败后重试）
    let abortGrace = null;    // loadabort 延迟判失败：等一等，看是否有 loadstop 跟上（幻影 abort）
    let loadTimer = null;
    let retryTimer = null;
    let hiddenSince = null;   // 开始持续不可见的时间戳（仅用于连接重试门控）
    let minimizedNow = false; // main.js 同步的最小化状态（轻量模式的唯一依据）
    let minimizedSince = null; // 开始持续最小化的时间戳

    function dsvmHome() {
      return process.env.DSVM_HOME || path.join(os.homedir(), '.dsvm');
    }

    function readSettings() {
      try {
        const raw = fs.readFileSync(path.join(dsvmHome(), 'desktop', 'settings.json'), 'utf8');
        const parsed = JSON.parse(raw);
        return { lightweightMode: parsed.lightweightMode === true };
      } catch {
        return { lightweightMode: false };
      }
    }

    // main.js（bg）维护的最小化状态。不用 visibility 判断：最小化有明确回调。
    function readMinimized() {
      try {
        const raw = fs.readFileSync(path.join(dsvmHome(), 'desktop', 'runtime-state.json'), 'utf8');
        return JSON.parse(raw).minimized === true;
      } catch {
        return false;
      }
    }

    /** 读本地服务地址；读不到 / 进程已死都返回 null（视为未启用）。 */
    function readServiceUrl() {
      try {
        const raw = fs.readFileSync(path.join(dsvmHome(), 'service', 'url.json'), 'utf8');
        const state = JSON.parse(raw);
        if (typeof state.url !== 'string' || !state.url) return null;
        if (Number.isInteger(state.pid) && state.pid > 0) {
          try { process.kill(state.pid, 0); } catch { return null; }
        }
        return state.url;
      } catch {
        return null;
      }
    }

    function show(el) {
      overlay.hidden = false;
      connecting.hidden = el !== connecting;
      failure.hidden = el !== failure;
    }

    function showView() {
      overlay.hidden = true;
      view.hidden = false;
    }

    function setState(next, hint) {
      state = next;
      if (next === 'connecting') {
        view.hidden = true;
        if (hint) connectingHint.textContent = hint;
        show(connecting);
      } else if (next === 'error') {
        view.hidden = true;
        currentUrl = null;
        show(failure);
      } else if (next === 'ready') {
        showView();
      }
    }

    function probe(url, timeoutMs) {
      // 只要能连上就算活：no-cors 下虽然读不到响应体，但连接失败仍会 reject。
      // （本页 origin 是 chrome-extension，直接 cors 取 http://127.0.0.1 会被拦。）
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      return fetch(url, { signal: controller.signal, redirect: 'follow', mode: 'no-cors' })
        .then((res) => { clearTimeout(timer); return res; })
        .catch((err) => { clearTimeout(timer); throw err; });
    }

    async function connect() {
      // 不可见时不重试：只记录不可见起始时间，轻量后台模式靠它计时。
      if (document.visibilityState !== 'visible') {
        if (hiddenSince === null) hiddenSince = Date.now();
        scheduleRetry();
        return;
      }
      hiddenSince = null;

      // 已就绪且 URL 没变（token 重启会变）：无需重复装载。
      const url = readServiceUrl();
      if (!url) {
        if (state !== 'error') setState('error');
        scheduleRetry();
        return;
      }
      if (state === 'ready' && url === currentUrl) {
        scheduleRetry();
        return;
      }

      // 非首次一律静默：保持当前界面（失败页或已就绪的 webview），只换 src 重试。
      if (state !== 'connecting' && firstRun) setState('connecting');
      try {
        await probe(url, 5000);
      } catch {
        firstRun = false;
        needsReload = true;
        setState('error');
        scheduleRetry();
        return;
      }
      firstRun = false;

      // 探测通过：把 URL 装进 webview（嵌入而非顶层跳转）。
      // loadabort 会主动报失败；超时是兜底（比如事件没冒上来）。
      // 同 URL 不重复赋值：否则产生 superseded 幻影 abort（loadstart→abort→loadstart）。
      currentUrl = url;
      if (loadTimer) clearTimeout(loadTimer);
      const expected = url;
      loadTimer = setTimeout(() => {
        if (currentUrl === expected && state !== 'ready') {
          needsReload = true;
          setState('error');
          scheduleRetry();
        }
      }, LOAD_TIMEOUT_MS);
      if (navUrl !== url || needsReload) {
        navUrl = url;
        needsReload = false;
        view.src = url;
      }
      scheduleRetry();
    }

    function scheduleRetry() {
      if (retryTimer) clearTimeout(retryTimer);
      // 就绪态无需轮询：token 变化只能靠服务重启发现，届时 webview 会先挂；
      // 保持一个低频心跳以便自动回到失败态重试。
      retryTimer = setTimeout(connect, state === 'ready' ? 15000 : RETRY_MS);
    }

    /** 轻量后台模式：持续最小化超阈值后卸载 webview，回到连接中页释放前端资源。 */
    function maybeUnloadForLightweight() {
      if (!minimizedNow) return;
      if (minimizedSince === null) minimizedSince = Date.now();
      if (!readSettings().lightweightMode) return;
      if (currentUrl === null && state !== 'ready') return;
      if (Date.now() - minimizedSince < HIDE_UNLOAD_MS) return;
      currentUrl = null;
      if (loadTimer) { clearTimeout(loadTimer); loadTimer = null; }
      if (abortGrace) { clearTimeout(abortGrace); abortGrace = null; }
      try { view.stop(); } catch { /* ignore */ }
      try { view.src = 'about:blank'; navUrl = 'about:blank'; } catch { /* ignore */ }
      // 杀掉 Guest 渲染进程，真释放内存（只跳 about:blank 的话旧堆还留在原进程里）。
      // 下次装载真实 URL 时 webview 会自动起新 Guest。
      try {
        if (typeof view.terminate === 'function') view.terminate();
      } catch { /* ignore */ }
      setState('connecting', '轻量后台模式：页面已卸载以节省资源，切回窗口自动恢复。');
    }

    // webview 装载成功：当前导航已 commit 即算就绪。
    // 注意不用 view.getUrl() 做二次确认：NW 里它不可靠，会永远卡在非 ready。
    view.addEventListener('loadstop', () => {
      if (!currentUrl) return; // about:blank（卸载后）的 loadstop 不算就绪
      if (abortGrace) { clearTimeout(abortGrace); abortGrace = null; }
      if (loadTimer) { clearTimeout(loadTimer); loadTimer = null; }
      hiddenSince = document.visibilityState === 'visible' ? null : Date.now();
      setState('ready');
      scheduleRetry();
    });

    // webview 装载失败：延迟一拍再判——同导航的 loadstop 可能随后就到
    // （重复赋值 src 产生的 superseded 幻影 abort），那时直接取消本次判失败。
    view.addEventListener('loadabort', (event) => {
      if (!event.isTopLevel || !currentUrl) return;
      if (abortGrace) clearTimeout(abortGrace);
      const reason = event.reason ? `（${event.reason}）` : '';
      abortGrace = setTimeout(() => {
        abortGrace = null;
        if (state === 'ready' || !currentUrl) return;
        if (loadTimer) { clearTimeout(loadTimer); loadTimer = null; }
        currentUrl = null;
        needsReload = true;
        setState('error');
        document.getElementById('retry-hint').textContent =
          `页面装载失败${reason}，会自动重试。`;
        scheduleRetry();
      }, 400);
    });

    // dsh 里 target=_blank 的外链：不让它在应用里另开窗口，转系统浏览器。
    // 注意：Chrome webview 的正确拦截是 e.window.discard()，preventDefault 无效。
    view.addEventListener('newwindow', (event) => {
      try {
        if (event.window && typeof event.window.discard === 'function') {
          event.window.discard();
        }
      } catch (err) {
        console.error(`dsvm desktop: cannot discard popup: ${err.message}`);
      }
      const target = event.targetUrl;
      if (target) openExternalUrl(target);
    });

    // 权限请求：只放行通知，其余拒绝（dsh 目前不需要定位/媒体等）。
    view.addEventListener('permissionrequest', (event) => {
      try {
        if (event.permission === 'notifications') event.request.allow();
        else event.request.deny();
      } catch { /* ignore */ }
    });

    // 可见性变化：变为可见的一瞬间立刻重试一次；不可见时开始计时。
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        hiddenSince = null;
        if (state !== 'ready') connect();
        else {
          // 就绪态切回也顺手确认一次 URL 是否过期（token 可能已轮换）。
          const url = readServiceUrl();
          if (url && url !== currentUrl) connect();
        }
      } else if (hiddenSince === null) {
        hiddenSince = Date.now();
      }
    });

    // 最小化状态轮询与轻量卸载检查：1s 一次，开销可忽略。
    // 从最小化恢复的一瞬间，若不在就绪态立刻重试一次。
    setInterval(() => {
      const wasMinimized = minimizedNow;
      minimizedNow = readMinimized();
      if (minimizedNow) {
        if (minimizedSince === null) minimizedSince = Date.now();
      } else {
        const justRestored = wasMinimized && minimizedSince !== null;
        minimizedSince = null;
        if (justRestored && state !== 'ready') connect();
        else if (justRestored) {
          // 就绪态恢复也顺手确认一次 URL 是否过期（token 可能已轮换）。
          const url = readServiceUrl();
          if (url && url !== currentUrl) connect();
        }
      }
      maybeUnloadForLightweight();
    }, 1000);

    connect();
  </script>
</body>
</html>
